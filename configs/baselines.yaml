# Méthodes de référence — voir doc de suivi section 6.2
# Chaque entrée doit pointer vers des poids pré-entraînés ou un script de reproduction.

baselines:
  degraded_input:
    type: "passthrough"

  task_specific:
    dehaze: {name: "TBD", weights_path: null}
    derain: {name: "TBD", weights_path: null}
    lowlight_enhance: {name: "TBD", weights_path: null}

  all_in_one:
    airnet: {weights_path: null}
    promptir: {weights_path: null}
    moce_ir: 
      weights_path: null
      inp_channels: 3
      out_channels: 3
      dim: 32
      levels: 4
      heads: [1, 1, 1, 1]
      num_blocks: [1, 1, 1, 3]
      num_dec_blocks: [1, 1, 1]
      ffn_expansion_factor: 2
      num_refinement_blocks: 1
      LayerNorm_type: 'WithBias'
      bias: false
      rank: 2
      num_experts: 4
      depth_type: "lin"
      stage_depth: [3, 2, 1]
      rank_type: "constant"
      topk: 1
      with_complexity: false
      complexity_scale: "max"

  general_restoration:
    restormer: {weights_path: null}
