fog:
  enable: true
  depth_model: "depth-anything/Depth-Anything-V2-Small-hf"
  strength_range: [0.10,0.65,  1.25]
  heterogeneity_range: [0.0, 0.15, 0.35]
  blur_sigma: 1.5

rain:
  enable: true
  rain_types: [drizzle, default, heavy, torrential]
  drop_length: [10, 20, 60]
  drop_width: 1
  slant_range: [-20, 20]

lowlight:
  enable: true
  brightness_limit_range: [-0.35, -0.2, -0.1]
  contrast_limit_range: [-0.4, -0.25, -0.1]
  shot_noise_range: [0.0, 0.0, 0.0]
  saturation_range: [0.4, 0.8, 1.0]


seed_base: 42
